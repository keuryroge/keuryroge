name: Generate Neon Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Neon Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: keuryroge
          outputs: |
            dist/github-snake.svg?color_snake=%23168BFF&color_dots=%230D1117,%23001F3F,%23003366,%230066CC,%23168BFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300A8FF

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
